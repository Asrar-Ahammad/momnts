services:

  # ── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: momnts-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # Limit Redis to 256MB; evict least-recently-used keys if exceeded
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    networks:
      - momnts-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js API ────────────────────────────────────
  momnts-api:
    image: momnts-api:latest
    container_name: momnts-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - momnts-network

  # ── Photo processing worker ────────────────────────
  momnts-worker-photos:
    image: momnts-api:latest
    container_name: momnts-worker-photos
    restart: unless-stopped
    command: node dist/src/workers/photo.worker.js
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - momnts-network

  # ── Face matching worker ───────────────────────────
  momnts-worker-matching:
    image: momnts-api:latest
    container_name: momnts-worker-matching
    restart: unless-stopped
    command: node dist/src/workers/match.worker.js
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - momnts-network

networks:
  momnts-network:
    driver: bridge

volumes:
  redis-data: